<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дашборд директора | 3D Print Platform</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container header__inner">
            <div class="logo">
                <img src="images/logo.png" alt="Logo" class="logo__img">
            </div>
            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="manager.html" class="nav__link">Все заказы</a>
            </nav>
            <div class="auth-buttons">
                <span style="color: #fff; font-size: 20px; margin-right: 20px;">Директор</span>
                <a href="#" id="logoutBtn" class="btn-secondary">Выйти</a>
            </div>
        </div>
    </header>

    <section class="hero" style="padding: 80px 0; background: none;">
        <div class="container">
            <div class="auth-card" style="max-width: 900px;">
                <h2 class="section-title" style="text-align: center; margin-bottom: 50px;">Дашборд директора</h2>

                <div id="dashboardStats" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Карточки будут заполнены JS -->
                </div>

                <div style="margin-top: 40px; text-align: center;">
                    <button onclick="loadDashboard()" class="btn-primary" style="padding: 12px 40px;">
                        Обновить статистику
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script>
        function getAuthHeaders() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert('Сессия истекла. Войдите заново.');
                window.location.href = 'login.html';
                return {};
            }
            return { 'Authorization': `Bearer ${token}` };
        }

        async function loadDashboard() {
            const container = document.getElementById('dashboardStats');
            container.innerHTML = '<p style="text-align: center;">Загрузка...</p>';

            try {
                const res = await fetch('http://127.0.0.1:8000/admin/dashboard', {
                    headers: getAuthHeaders()
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                    }
                    throw new Error(await res.text());
                }

                const data = await res.json();

                container.innerHTML = `
                    <div style="background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center;">
                        <h3 style="font-size: 24px; margin-bottom: 10px;">Все заказы</h3>
                        <p style="font-size: 48px; font-weight: bold;">${data.total_orders}</p>
                    </div>
                    <div style="background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center;">
                        <h3 style="font-size: 24px; margin-bottom: 10px;">Завершено</h3>
                        <p style="font-size: 48px; font-weight: bold; color: #0f0;">${data.completed_orders}</p>
                    </div>
                    <div style="background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center;">
                        <h3 style="font-size: 24px; margin-bottom: 10px;">В работе</h3>
                        <p style="font-size: 48px; font-weight: bold; color: #ff9800;">${data.pending_orders}</p>
                    </div>
                    <div style="background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; grid-column: span 3;">
                        <h3 style="font-size: 24px; margin-bottom: 10px;">Общая выручка</h3>
                        <p style="font-size: 48px; font-weight: bold; color: #4caf50;">${data.total_revenue} ₽</p>
                        <p style="margin-top: 10px; opacity: 0.8;">
                            Завершённые: ${data.completed_revenue} ₽<br>
                            В работе: ${data.pending_revenue} ₽
                        </p>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p style="color: #FF3B30; text-align: center;">Ошибка: ${err.message}</p>`;
            }
        }

        // Выход
        document.getElementById('logoutBtn').addEventListener('click', e => {
            e.preventDefault();
            if (confirm('Выйти?')) {
                localStorage.removeItem('access_token');
                window.location.href = 'index.html';
            }
        });

        // Запуск
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
        });
    </script>
</body>

</html>
