<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход | 3D Print Platform</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>
<script src="script.js"></script>

<body>
    <header class="header">
        <div class="container header__inner">
            <div class="logo">
                <img src="images/logo.png" alt="Logo" class="logo__img">
            </div>
            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
            </nav>
        </div>
    </header>

    <section class="hero" style="padding: 120px 0; background: none;">
        <div class="container">
            <div class="auth-card">
                <h2 class="section-title" style="font-size: 42px; margin-bottom: 40px;">Вход</h2>
                <form id="loginForm">
                    <input type="text" placeholder="Логин или Email" required class="auth-input" name="login">
                    <input type="password" placeholder="Пароль" required class="auth-input" name="password">

                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 30px;">Войти</button>
                </form>
                <p style="text-align: center; margin-top: 30px; opacity: 0.9;">
                    Нет аккаунта? <a href="register.html" style="color: #FF3B30;">Регистрация</a>
                </p>
            </div>
        </div>
    </section>
</body>

</html>
