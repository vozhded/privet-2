<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация / Вход</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Регистрация / Вход</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="order.html">Оформить заказ</a>
            <a href="#services">Услуги</a>
            <a href="#about">О нас</a>
            <a href="#contact">Контакты</a>
        </nav>
    </header>

    <section class="login-section">
        <h2>Регистрация или Вход</h2>
        <form class="login-form">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя пользователя" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>
            <div class="form-group">
                <label for="email">Email (для регистрации)</label>
                <input type="email" id="email" placeholder="Введите email" required>
            </div>
            <button type="submit" class="btn">Войти</button>
            <button type="button" class="btn register-btn">Зарегистрироваться</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Услуги 3D Печати</p>
    </footer>
</body>

</html>
